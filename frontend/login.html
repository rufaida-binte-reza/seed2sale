<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed2Sale — Sign In / Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    :root {
      --sage: #7BA97B;
      --soil: #4B3F32;
      --sand: #EDE6DA;
    }
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[var(--sand)] text-[var(--soil)]">
  <div x-data="authPage()" class="min-h-screen flex">
    <!-- LEFT: Auth Form -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8">
      <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-[var(--sage)]/10">
          <!-- Logo -->
          <div class="text-center mb-8">
            <div
              class="inline-flex items-center justify-center w-16 h-16 bg-[var(--sage)]/10 rounded-full mb-4"
            >
              <i
                x-show="isLogin"
                class="fas fa-seedling text-[var(--sage)] fa-lg"
              ></i>
              <i
                x-show="!isLogin"
                class="fas fa-user-plus text-[var(--sage)] fa-lg"
              ></i>
            </div>
            <h2 class="text-2xl font-bold text-[var(--soil)]">
              <span x-text="isLogin ? 'Welcome Back!' : 'Create Your Account'"></span>
            </h2>
            <p class="text-gray-600 mt-2">
              <span
                x-text="isLogin ? 'Sign in to continue your farm-fresh journey' : 'Join the Seed2Sale community today'"
              ></span>
            </p>
          </div>

          <!-- FORM -->
          <form @submit.prevent="handleSubmit">
            <!-- Name (Register only) -->
            <div x-show="!isLogin" class="mb-6 transition-all duration-300 ease-out">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Full Name</label
              >
              <input
                type="text"
                x-model="name"
                required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                placeholder="John Doe"
              />
            </div>

            <!-- Email / Phone -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Email or Phone Number</label
              >
              <div class="relative">
                <input
                  <input id="email" type="text" x-model="contact" required
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                  placeholder="you@example.com or +8801XXXXXXXXX"
                />
                <i
                  class="fas fa-user absolute right-3 top-4 text-gray-400"
                ></i>
              </div>
              <p
                x-show="contact && !validateContact(contact)"
                class="mt-2 text-sm text-red-600"
              >
                Enter a valid email or phone number
              </p>
            </div>

            <!-- Phone (Register only) -->
            <div x-show="!isLogin" class="mb-6 transition-all duration-300 ease-out">
              <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
              <input
                type="tel"
                x-model="phone"
                pattern="^(?:\+?88)?01[3-9]\d{8}$"
                required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                placeholder="+8801XXXXXXXXX"
              />
              <p
                x-show="phone && !validatePhone(phone)"
                class="mt-2 text-sm text-red-600"
              >
                Enter a valid Bangladeshi phone number
              </p>
            </div>

            <!-- Address (Register only) -->
            <div x-show="!isLogin" class="mb-6 transition-all duration-300 ease-out">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Address</label
              >
              <textarea
                x-model="address"
                required
                rows="2"
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                placeholder="House, Street, Village, District"
              ></textarea>
            </div>

            <!-- Password -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Password</label
              >
              <div class="relative">
                <input
                  <input id="password" type="password" x-model="password" required
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                  @click="showPassword = !showPassword"
                >
                  <i
                    :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
                  ></i>
                </button>
              </div>
              <p
                x-show="password && !validatePassword(password)"
                class="mt-2 text-sm text-red-600"
              >
                Password must be at least 8 characters
              </p>
            </div>

            <!-- Confirm Password (Register only) -->
            <div x-show="!isLogin" class="mb-6 transition-all duration-300 ease-out">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Confirm Password</label
              >
              <div class="relative">
                <input
                  :type="showConfirmPassword ? 'text' : 'password'"
                  x-model="confirmPassword"
                  required
                  class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[var(--sage)] focus:border-transparent"
                  placeholder="••••••••"
                />
                <button
                  type="button"
                  class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
                  @click="showConfirmPassword = !showConfirmPassword"
                >
                  <i
                    :class="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
                  ></i>
                </button>
              </div>
              <p
                x-show="confirmPassword && !validateConfirmPassword()"
                class="mt-2 text-sm text-red-600"
              >
                Passwords do not match
              </p>
            </div>

            <!-- SUBMIT -->
            <button
              type="submit"
              class="w-full bg-[var(--sage)] text-white py-3 rounded-lg font-semibold hover:bg-[#6d946d] focus:ring-4 focus:ring-[var(--sage)]/40 transition-colors disabled:opacity-50"
              :disabled="
                loading ||
                (contact && !validateContact(contact)) ||
                (password && !validatePassword(password)) ||
                (!isLogin && confirmPassword && !validateConfirmPassword())
              "
            >
              <span x-show="loading" class="inline-flex items-center">
                <svg
                  class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
                Processing...
              </span>
              <span
                x-show="!loading"
                x-text="isLogin ? `Sign In` : `Register`"
              ></span>
            </button>

            <!-- SWITCH -->
            <p class="mt-6 text-center text-gray-600">
              <span
                x-text="isLogin ? `Don't have an account?` : `Already registered?`"
              ></span>
              <button
                type="button"
                class="ml-1 text-[var(--sage)] hover:text-[#5e845e] font-semibold focus:outline-none"
                @click="isLogin = !isLogin"
              >
                <span x-text="isLogin ? 'Register' : 'Sign in'"></span>
              </button>
            </p>
          </form>
        </div>
      </div>
    </div>

    <!-- RIGHT: Background image -->
    <div
      class="hidden lg:block lg:w-1/2 bg-cover bg-center relative"
      style="background-image: url('https://images.pexels.com/photos/2316571/pexels-photo-2316571.jpeg?auto=format&fit=crop&q=80')"
    >
      <div
        class="absolute inset-0 bg-[var(--soil)]/60 flex items-center justify-center"
      >
        <div class="text-center text-white px-12">
          <h2 class="text-4xl font-bold mb-4">Farm to Table, Simplified</h2>
          <p class="text-lg opacity-90">
            Join a community that values freshness, fairness, and the planet.
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    document.addEventListener("alpine:init", () => {
      Alpine.data("authPage", () => ({
        isLogin: true,
        showPassword: false,
        showConfirmPassword: false,
        contact: "",
        email: "",
        phone: "",
        address: "",
        password: "",
        confirmPassword: "",
        name: "",
        loading: false,

        validateEmail(email) {
          return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email);
        },
        validatePhone(phone) {
          return /^(?:\\+?88)?01[3-9]\\d{8}$/.test(phone);
        },
        validateContact(contact) {
          return this.validateEmail(contact) || this.validatePhone(contact);
        },
        validatePassword(password) {
          return password.length >= 8;
        },
        validateConfirmPassword() {
          return this.password === this.confirmPassword;
        },

        handleSubmit() {
          this.loading = true;
          setTimeout(() => {
            this.loading = false;
            alert(
              this.isLogin
                ? "Login successful!"
                : "Registration successful! Welcome to Seed2Sale 🌱"
            );
          }, 1500);
        },
      }));
    });
  </script>

<script type="module">
  import { login } from './auth.js';

  // real JWT login (only when in sign-in mode)
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    const alpine = document.querySelector('[x-data]')._x_dataStack[0];
    if (!alpine.isLogin) return;          // let Alpine handle register
    e.preventDefault();
    try {
      await login(alpine.contact, alpine.password); // contact field == email
    } catch {
      alert('Login failed');
    }
  });
</script>

</body>
</html>
