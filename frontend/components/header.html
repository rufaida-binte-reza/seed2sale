<header class="bg-[rgba(59,122,87,0.95)] text-white fixed w-full z-40 shadow">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="home.html" class="flex items-center gap-3">
        <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" fill="#3B7A57"></circle>
          <path d="M8.5 13.5c1.2-1.6 3.4-3 6-2.6" stroke="#EDE6DA" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.2 8.6c.6.8 1.9 1.1 3.1 0.7.9-.3 1.9-1.2 2.4-2.1-.8.2-1.9.1-2.8-.2-1-.3-2-1-2.7-1.7-.5.8-1 2.1-.97 3.3z" fill="#CDECCF" />
          <path d="M11.5 7.8c.35-1.2.9-2.2 1.6-3.1-.6.3-1.8 1.1-2.4 1.9-.5.6-.8 1.4-.8 1.4s.7-.05 1.6-.2z" fill="#94D3A2"/>
        </svg>
        <span class="font-extrabold text-lg tracking-tight">Seed2Sale</span>
      </a>

      <!-- Center Search -->
      <div class="hidden lg:flex lg:items-center lg:gap-4 flex-1 justify-center">
        <div class="w-full max-w-2xl relative">
          <div class="flex items-center bg-white rounded-full shadow px-3 py-2">
            <select class="appearance-none bg-white pr-2 text-sm border-none focus:ring-0">
              <option>All Categories</option>
              <option>Vegetables</option>
              <option>Fruits</option>
              <option>Dairy</option>
              <option>Fish &amp; Meat</option>
            </select>
            <input type="search" placeholder="Search produce or farmers..."
                   class="flex-1 px-3 py-2 text-sm bg-white outline-none" />
            <button
              class="ml-2 bg-[#3B7A57] hover:bg-[#2f6b4b] text-white px-4 py-2 rounded-full text-sm shadow">
              Search
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <button class="text-sm px-4 py-2 rounded border border-white/30 hover:bg-white/10">Login</button>
        <button class="text-sm px-4 py-2 rounded bg-[#A67B5B] text-white hover:bg-[#8f6547]">Register</button>

        <!-- Cart -->
        <button class="relative p-2 rounded-full bg-white/10 hover:bg-white/20">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
            <path d="M6 7h12l-1 12H7L6 7z" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 7V5a3 3 0 116 0v2" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="absolute -top-1 -right-1 bg-amber-400 text-xs text-brown-800 font-semibold rounded-full w-5 h-5 flex items-center justify-center">2</span>
        </button>
      </div>
    </div>
  </div>
</header>
